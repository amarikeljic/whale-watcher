# Three containers from one image, sharing the database in ./data:
#
#   whale-watcher-detector   watches trades and publishes tracked wallets' fills
#   whale-watcher            the runner: alerts, the paper bot, nightly review, stats
#   whale-watcher-dashboard  the web dashboard (reads everything, can change one setting)
#
# Separate so that one crashing or restarting never stops the others: the detector
# keeps publishing while the runner is down, and the runner resumes from its cursor.
# The detector and the runner have no `ports:`. They only make outbound HTTPS
# GET requests to Polymarket's public read-only APIs. They send nothing and nothing listens.
# The dashboard is the only thing that listens, and only on this machine's 127.0.0.1.
x-common: &common
  # GIT_COMMIT names the commit on every row the service writes. Build and start with:
  #   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
  build:
    context: .
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
  image: whale-watcher
  restart: unless-stopped
  volumes:
    - ./data:/app/data
    - ./config.yaml:/app/config.yaml:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  whale-watcher:
    <<: *common
    container_name: whale-watcher
    command: ["python", "-m", "whalewatcher", "monitor", "--no-detector"]

  detector:
    <<: *common
    container_name: whale-watcher-detector
    command: ["python", "-m", "whalewatcher", "detector"]
    healthcheck:
      test: ["CMD", "python", "-m", "whalewatcher", "health", "--detector"]
      interval: 2m
      timeout: 30s
      start_period: 5m
      retries: 3

  # It reads: the database is opened read-only and every page is a GET. The one thing
  # it can change is the simulated wallet amount (one row of the settings table). It
  # makes no outbound requests. The port is published on 127.0.0.1 ONLY, so nothing on the
  # LAN or the internet can reach it. To see it from your phone, expose it on your
  # tailnet yourself:   tailscale serve --bg 8787
  dashboard:
    <<: *common
    container_name: whale-watcher-dashboard
    command: ["python", "-m", "whalewatcher", "dashboard", "--host", "0.0.0.0", "--in-container"]
    ports:
      - "127.0.0.1:8787:8787"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/healthz', timeout=5)"]
      interval: 2m
      timeout: 10s
      start_period: 30s
      retries: 3
