services:
  whale-watcher:
    build: .
    image: whale-watcher
    container_name: whale-watcher
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    # Deliberately no `ports:`. The service only makes outbound HTTPS requests
    # (Polymarket read-only APIs, the Discord webhook). Nothing listens.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
