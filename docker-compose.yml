# Two containers from one image, sharing the database in ./data (v2 Phase 3):
#
#   whale-watcher-detector  watches trades and publishes tracked wallets' fills
#   whale-watcher           the runner: alerts, the paper bot, nightly review, stats
#
# Separate so that one crashing or restarting never stops the other: the detector
# keeps publishing while the runner is down, and the runner resumes from its cursor.
# Neither has `ports:`. They only make outbound HTTPS requests (Polymarket's
# read-only APIs, the Discord webhook). Nothing listens.
x-common: &common
  build: .
  image: whale-watcher
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/app/data
    - ./config.yaml:/app/config.yaml:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  whale-watcher:
    <<: *common
    container_name: whale-watcher
    command: ["python", "-m", "whalewatcher", "monitor", "--no-detector"]

  detector:
    <<: *common
    container_name: whale-watcher-detector
    command: ["python", "-m", "whalewatcher", "detector"]
    healthcheck:
      test: ["CMD", "python", "-m", "whalewatcher", "health", "--detector"]
      interval: 2m
      timeout: 30s
      start_period: 5m
      retries: 3
