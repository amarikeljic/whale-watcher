# Whale Watcher configuration. Secrets go in .env, never here.
# Every key is optional; anything left out takes the default in whalewatcher/config.py.

database_path: data/whalewatcher.sqlite3

scoring:
  # The requirements below come from `python -m whalewatcher optimize` (see README,
  # "Which wallets to track"): the concentration rule was the only one positive in
  # all three test periods and beat random wallet sets out of sample. The spec's
  # original values are kept on the right, and in whalewatcher/optimize.py
  # (SPEC_REQUIREMENTS) for the backtest's comparison.
  lookback_months: 6
  min_settled_markets: 10         # spec: 50
  min_profitable_months: 0        # spec: 4 (out of the calendar months in the lookback window)
  max_single_market_share: 0.20   # spec: 0.30 (largest market's P&L / total P&L)
  min_avg_stake_usd: 0            # spec: 100
  max_days_since_last_trade: 30
  max_two_sided_ratio: 1.0        # spec: 0.40 (1.0 = off)
  min_roi: -1.0                   # spec: 0.05 (-1.0 = off)
  top_k: 20                       # research commands only (score, validate, backtest); live size is watchlist.max_size
  rank_by: roi                    # spec: clv. clv | clv_markout | roi | total_pnl
  # Additions not in the original spec (see README "Deviations"):
  entry_lookback_days: 180        # look this far before the window for entries in markets that settle inside it
  max_activity_rows: 20000        # busier wallets are bots/market makers; skipped before the full fetch
  max_unreliable_market_share: 0.25  # markets we cannot account for (neg-risk conversions, transfers)
  markout_hours: 24               # horizon for clv_markout
  min_clv_positions: 10           # fewer CLV data points than this and the wallet cannot be ranked by CLV
  clv_sample_positions: 150       # seeded sample per wallet for CLV lookups (0 = every position)

candidates:
  leaderboard_periods: [week, month, all]
  leaderboard_categories: [overall]
  leaderboard_limit: 100          # per period x category
  recent_trades_min_usd: 1000     # "large traders seen in recent trade data"
  recent_trades_pages: 5          # pages of 1000 trades from the global feed
  historical_markets: 150         # leak-free pool for past as_of dates: top markets by volume...
  historical_per_event: 3         # ...at most this many per event, so one mega-event cannot fill the pool
  historical_min_trade_usd: 1000
  max_candidates: 400

alerts:
  poll_interval_seconds: 60       # the per-wallet backstop; detection itself is bot.feed_poll_seconds
  min_whale_trade_usd: 500
  dedupe_window_seconds: 300
  min_price: 0.05
  max_price: 0.95
  max_alert_age_seconds: 600      # older fills (API lag, start-up backlog) are skipped as stale

# The old rule (one paper fill a poll after the alert). Closed to new alerts since the
# bot model below started; these settings still settle its open trades, and
# max_slippage is the miss rule of the bot's "old rule" comparison column.
paper:
  stake_usd: 10
  reaction_polls: 1
  max_slippage: 0.03
  strategy: hold_to_resolution
  settle_interval_seconds: 600

# The bot model (v2 Phase 3): PAPER ONLY. A detector publishes each tracked wallet's
# fills seconds after they happen; the runner acts on the order book at that instant.
# Each strategy is its own paper account with its own bankroll and limits.
bot:
  feed_poll_seconds: 1.0          # global trade feed. 1 request/s is about 3% of its rate limit
  runner_poll_seconds: 0.5        # how often the runner looks for newly published fills
  max_signal_age_seconds: 30      # acting later than this is not "seconds after the whale": MISSED
  max_slippage: 0.03              # limit price = the whale's price + this. Beyond it: MISSED, not chased
  human_delay_seconds: 60         # the old rule, kept as a comparison column on every signal
  mirror_exit_fraction: 0.5       # flat_mirror sells once the whale has sold this share of its position
  scale_whale_usd: 500            # scaled_hold: stake = stake_usd x (whale's buy / this), capped
  placebo_min_delay_seconds: 300  # placebo_late: the same outcome, bought at a random time this long...
  placebo_max_delay_seconds: 1800 # ...to this long after the signal. The control for "does timing matter?"
  markout_seconds: 300            # price this long after our fill: CLV that also works for in-play fills
  flat_hold:                      # fixed stake, held to resolution. The headline
    starting_bankroll: 1000
    stake_usd: 10
    max_stake_usd: 10
    max_market_exposure_usd: 30   # open cost in one market
    max_event_exposure_usd: 50    # ...and in one event (one game has several markets)
    daily_loss_limit_usd: 100     # realised loss in a UTC day that pauses new entries
  flat_mirror:                    # fixed stake, sold when the whale sells
    starting_bankroll: 1000
    stake_usd: 10
    max_stake_usd: 10
    max_market_exposure_usd: 30
    max_event_exposure_usd: 50
    daily_loss_limit_usd: 100
  scaled_hold:                    # stake grows with the whale's buy, $10 to $50
    starting_bankroll: 1000
    stake_usd: 10
    max_stake_usd: 50
    max_market_exposure_usd: 100
    max_event_exposure_usd: 150
    daily_loss_limit_usd: 200
  placebo_late:                   # the control arm
    starting_bankroll: 1000
    stake_usd: 10
    max_stake_usd: 10
    max_market_exposure_usd: 30
    max_event_exposure_usd: 50
    daily_loss_limit_usd: 100

# The consensus strategy (v2 Phase 3b): does agreement among independent top traders
# predict anything? `python -m whalewatcher consensus` shows today's pool at each
# profit bar; `consensus --backtest` replays six months with the pool rebuilt every
# day from that day's data only.
consensus_pool:
  min_profit_30d_usd: 100000      # the profit bar. 100k / 250k / 500k / top 50 are all reported
  top_n: 0                        # > 0: keep the top N by 30-day profit instead of using the bar
  min_trades_per_day: 5           # transactions a day over the 30 days
  max_trades_per_day: 200         # above this it is probably a market maker or a bot
  max_two_sided_ratio: 0.40       # share of its markets where it bought both sides
  entity_min_jaccard: 0.60        # two wallets are one entity if their sets of markets overlap this much...
  entity_min_cotrades: 10         # ...or they bought the same outcome within 10 s this many times...
  entity_min_cotrade_share: 0.30  # ...making up this share of the less active one's buys
consensus:
  min_agreeing_entities: 3
  min_position_usd: 1000          # an entity's net position in the outcome, at cost
  max_opposing_entities: 0        # pool entities allowed on another outcome of the same market
  window_hours: 48                # entries older than this are not fresh agreement
  backtest_delay_seconds: 5       # the bot acts this long after the fill that completes the consensus
  ask_premium: 0.01               # added to the historical minute price for the spread

# Time-to-close cutoff (v2.1). Applied by every bot runner and by the backtests.
# The end date is the market's scheduled end (Gamma `endDate`). It is a rule about
# the schedule: the real resolution time is recorded at settlement and reported.
filters:
  max_days_to_close: 14       # skip a market scheduled to end later than this (null = no limit)
  skip_if_no_end_date: true   # a market with no scheduled end could tie money up for ever

# The simulated small wallet (v2.1). The amount itself (default $100) is set on the
# dashboard or with `python -m whalewatcher wallet set 250`, not here. Changing the
# amount or any value below ends the current wallet run and starts a new one; old
# runs are kept.
bankroll:
  deploy_fraction: 0.8          # share of equity the wallet is willing to have in positions
  max_open_positions: 10        # stake = equity x deploy_fraction / this, never more than the cash
  # Our own floor. Polymarket's real minimum is per market and in SHARES (5 on every
  # book sampled 2026-11-12), so a $1 order of a 50-cent outcome is refused by the
  # venue anyway. The wallet applies both.
  min_order_usd: 1.00
  max_per_event_fraction: 0.2   # of equity, at cost, in one event
  mark_interval_seconds: 300    # how often open positions' best bids are recorded

# Costs (v2.1). Every paper fill pays the taker fee, on the buy and on a mirror-exit
# sell:  fee = shares x rate x price x (1 - price).  No rebate is ever counted.
fees:
  # Where the rate comes from:
  #   higher  whichever of the two below is higher: the pessimistic choice (the default).
  #   market  the market's own published rate. This is what the venue charges, and it
  #           does not always match the table (sports markets carry 0.03 as well as 0.05).
  #   table   the category table below.
  # Changing this re-costs every existing trade into the *_recalc columns; the fee each
  # trade was originally charged stays in `fees`.
  rate_source: higher
  onramp_cost_pct: 1.5            # one-time cost of getting money in; used by the wallet simulation only
  schedules:                      # add a new entry when Polymarket changes fees; trades use the one in force at their time
    - from: "2026-03-31"          # https://docs.polymarket.com/trading/fees.md, table read 2026-11-10
      rates:
        crypto: 0.07
        sports: 0.05
        politics: 0.04
        finance: 0.04
        economics: 0.05
        culture: 0.05
        weather: 0.05
        other: 0.05
        mentions: 0.04
        tech: 0.04
        geopolitics: 0.0
        combos: 0.05

stats:
  min_settled_for_conclusions: 30
  bootstrap_samples: 10000
  daily_summary_hour_utc: 13

rescore:
  enabled: true
  hour_utc: 0
  minute_utc: 20

# The persistent watchlist (v2). Every night: score candidates, ADD wallets that meet
# `entry`, re-score everyone on the list, and REMOVE a wallet only after it fails
# `exit` on fail_reviews_in_a_row nights running. Entry is stricter than exit on
# purpose, so a wallet near a line does not flip in and out. `python -m whalewatcher
# watchlist` shows the list, `--last` the latest review, `--history` every add/removal.
# Rules not listed here (unreliable markets, too-active wallets, ranking) come from `scoring`.
watchlist:
  max_size: 40
  probation_days: 14              # new members are tracked, and flagged in alerts and stats
  entry:
    min_roi: 0.02                 # closes the gap that let a 1% ROI wallet in (Phase 0)
    min_settled_markets: 30       # thin samples fake most apparent edge; costs no wallets today
    min_profitable_months: 0      # 0 = off: no out-of-sample value in the walk-forward search
    max_single_market_share: 0.20 # the one rule that held out of sample
    max_two_sided_ratio: 1.0      # 1.0 = off: the two checks below do this job
    max_days_since_last_trade: 30
    max_rebate_share: 0.30        # market maker: this share of lifetime income is rebates + rewards
    max_fills_per_market: 100     # bot: lifetime fills per market traded
  exit:
    min_roi: 0.0
    min_settled_markets: 15
    max_single_market_share: 0.30
    max_two_sided_ratio: 1.0
    max_days_since_last_trade: 45
    max_rebate_share: 0.50
    max_fills_per_market: 200
    fail_reviews_in_a_row: 3      # nights in a row a wallet must fail before it is removed
    live_min_events: 15           # once OUR paper trades on a wallet cover this many settled events...
    live_max_clv: 0.0             # ...a mean closing-line value below this is a failed review

api:
  user_agent: "whale-watcher/0.1 (read-only research)"
  timeout_seconds: 20
  max_concurrency: 16
  # rate_limits: per host and per endpoint, ~80% of the published limits (see config.py)
